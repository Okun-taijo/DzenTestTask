
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comments-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: comments-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: comments-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: comments-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: CommentsApp.API/Dockerfile
    container_name: comments-api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db,1433;Database=CommentsDb;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Pass: guest
      RabbitMq__Queue: comments_events
      Elastic__Uri: "http://elasticsearch:9200"
      Cors__AllowedOrigins__0: "https://localhost"
      Cors__AllowedOrigins__1: "https://localhost:443"
      Cors__AllowedOrigins__2: "https://localhost:5173"
      Cors__AllowedOrigins__3: "http://localhost:5173"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/Storage/uploads

  frontend:
    build:
      context: ./comments-frontend
      dockerfile: Dockerfile
    container_name: comments-frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
      - "443:443"

volumes:
  db_data:
  redis_data:
  elastic_data:
  uploads_data: